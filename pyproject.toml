[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-decisions-studio"
version = "1.0.0"
description = "Interactive Multimodal Case Studio, Zero-Trust BYOK Playground, FinOps ROI Calculator, and Hardened Google Cloud Run BFF for Google's Gemini Decisions API (gemini-decision-1)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Moshe Mazuz" }
]
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "tenacity>=8.2.0,<10.0.0",
  "google-genai>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demos*"]

[tool.setuptools.package-data]
"demos.gemini_decisions_conference" = ["static/*", "static/cases/*"]
